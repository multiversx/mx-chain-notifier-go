name: Tests

on:
  push:
    branches: [ main, rc/*, feat/* ]
  pull_request:
    branches: [ main, rc/*, feat/* ]

jobs:
  test:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go 1.26.2
        uses: actions/setup-go@v6
        with:
          go-version: 1.26.2
        id: go

      - name: Check out code
        uses: actions/checkout@v6

      - name: Get dependencies
        run: |
          go mod download
      - name: Unit tests
        run: make test
